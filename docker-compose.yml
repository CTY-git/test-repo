version: "3.9"
services:
    VulnerableApp-base:
      image: sasanlabs/owasp-vulnerableapp:unreleased
      security_opt:
        - no-new-privileges:true
      read_only: true

    VulnerableApp-jsp:
      image: sasanlabs/owasp-vulnerableapp-jsp:latest
      security_opt:
        - no-new-privileges:true
      read_only: true
 
    VulnerableApp-php:
      image: sasanlabs/owasp-vulnerableapp-php:latest
      security_opt:
        - no-new-privileges:true
      read_only: true
    
    VulnerableApp-facade:
      depends_on:
        - VulnerableApp-base
        - VulnerableApp-jsp
        - VulnerableApp-php
      image: sasanlabs/owasp-vulnerableapp-facade
      volumes:
       - ./templates:/etc/nginx/templates
      ports:
       - "80:80"
      environment:
       - NGINX_HOST=foobar.com
       - NGINX_PORT=80
      security_opt:
        - no-new-privileges:true
      read_only: true
